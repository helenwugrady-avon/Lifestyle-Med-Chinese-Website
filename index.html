<section id="nutrition" data-screen-label="Paths" style="max-width:1240px;margin:0 auto;padding:80px 24px;display:flex;flex-direction:column;gap:32px">

<section id="about" data-screen-label="About + Evidence" style="max-width:1240px;margin:0 auto;padding:80px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px">

    <p style="margin:0;line-height:1.85;color:#46534b">{{ t.aboutP }}</p>

const root=document.getElementById('app');
let component;
class DCLogic {
  setState(patch){Object.assign(this.state,patch);render();}
}
